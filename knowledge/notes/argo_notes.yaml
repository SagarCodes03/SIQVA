    - core-argo-parameters
  verified: false
  checked_on: ""

- id: float-cycle-and-depth
  question_examples:
    - "How does an Argo float work and how deep does it go?"
    - "What is the standard float mission cycle?"
    - "How long does an Argo float profile take?"
  answer: >
    The standard Argo float operates on a recurring 10-day mission cycle that begins by sinking from the surface to a parking depth of 1000 meters.
    The float drifts passively with deep currents at 1000 meters for roughly 9 days before sinking further to its maximum profiling depth of 2000 meters.
    From 2000 meters, it rises slowly to the sea surface over approximately 6 hours while continuously recording temperature, conductivity, and pressure.
    Upon surfacing, the float obtains a GPS position fix, transmits its profile data to satellites during a 15-to-60 minute window, and then begins the next cycle.
  source_id: argo-how-floats-work
  section_or_page: 'Section "What does an Argo float do?"'
  source_version: ""
  limits: "Covers standard core park-and-profile missions only; does not cover specialized biogeochemical 1-day bursts or Deep Argo missions down to 6000 meters."
