- id: argo-gdac-structure
  question_examples:
  - What are the Argo GDACs and where are they located?
  - How does data synchronization work between GDACs?
  - What role do DACs and GDACs play in the Argo data system?
  answer: 'The international Argo data system delivers observations to users through
    two mirror Global Data Assembly Centers (GDACs). The two GDACs are the Coriolis
    Data Center in France and the US Navy''s Fleet Numerical Meteorology and Oceanography
    Center (FNMOC). Data holdings at the two Argo GDACs are synchronized once per
    day to ensure redundancy and uniform global access. The two GDACs receive standardized
    netCDF files that have been processed by 11 national Data Assembly Centers (DACs).

    '
  source_id: wong2020
  section_or_page: Pages 6–7, Section "Components of the Argo Data System"
  source_version: Vol. 7, Art. 700
  retrieved_on: '2026-11-14'
  limits: Describes global data assembly centers; does not detail initial satellite
    telemetry decoding performed upstream by national Data Assembly Centres (DACs).
