- id: argo-array-size-and-coverage
  question_examples:
    - "How many floats are active in the Argo network?"
    - "Where are Argo floats distributed globally?"
    - "What is the global target density of the Argo array?"
  answer: >
    The global Argo network maintains a target operating fleet of approximately 4000 active autonomous profiling floats worldwide.
    The primary array is distributed at an approximate 3-degree by 3-degree spatial resolution across the open ocean between 60 degrees North and 60 degrees South.
    Floats drift passively with ocean currents, resulting in a quasi-random global distribution that ensures continuous coverage of major oceanic basins.
    The array is maintained through regular deployments by dozens of international partner nations to replace aging floats that expire after 4 to 5 years of service.
  source_id: argopy-what-is-argo
  section_or_page: 'Section "What is Argo ?"'
  source_version: ""
  limits: "Does not guarantee uniform density in narrow marginal seas, boundary currents, or shallow shelf regions shallower than 2000 meters."
