- id: bgc-argo-parameters
  question_examples:
  - What parameters do BGC Argo floats measure?
  - What is Biogeochemical Argo?
  - What sensors are added to BGC floats?
  answer: 'The Argo Quality Control Manual for Biogeochemical Data defines quality
    control procedures for floats measuring chemical and biological properties. Defined
    parameters in the biogeochemical data system include dissolved oxygen (DOXY),
    chlorophyll-a (CHLA), particle backscattering (BBP), downwelling irradiance, nitrate,
    and pH. Users are warned that the accuracy of raw biogeochemical data in their
    unadjusted state is not suitable for direct usage in scientific applications.
    Often, adjustments are needed before biogeochemical observations can be used for
    meaningful scientific applications.

    '
  source_id: argo-qc-bgc
  section_or_page: Pages 6–9, Section 2.1 "Real-time quality control for biogeochemical
    data"
