- id: data-modes-rad
  question_examples:
    - "What are Argo data modes R, A, and D?"
    - "What is delayed-mode data in Argo?"
    - "What does the DATA_MODE field mean in Argo netCDF files?"
  answer: >
    Every profile in the Argo dataset is labeled with an operational data mode of R, A, or D.
    Mode R designates real-time data that have undergone only automated screening tests and are published within 24 hours of transmission.
    Mode A indicates real-time data that have received an automated calibration adjustment before formal delayed-mode assessment.
    Mode D represents delayed-mode data that have undergone expert visual inspection, sensor drift corrections against hydrographic reference climatologies, and realistic error estimation.
  source_id: argo-user-manual
  section_or_page: "Page 19-20, Section 2.2.3"
  source_version: "3.44.0"
  limits: "Describes data mode classification; does not detail specific delayed-mode salinity drift fitting algorithms (e.g., OWC method)."
