- id: qc-flag-scale
  question_examples:
    - "What do the Argo quality control flags mean?"
    - "Explain the 0 to 9 Argo QC flag scale."
    - "What is the difference between flag 1 and flag 4 in Argo?"
  answer: >
    Argo uses a standardized numerical quality control scale from 0 to 9 to evaluate each individual measurement level.
    Flag 1 denotes good data where all quality control checks passed, while flag 2 indicates probably good data that should be used with caution.
    Flag 3 marks probably bad data that may be adjusted later, and flag 4 represents bad data that must not be used in scientific analysis.
    Flag 0 indicates that no quality control was performed, and flag 9 represents missing values.
  source_id: argo-user-manual
  section_or_page: "Page 76, Reference table 2"
  source_version: "3.44.0"
  limits: "Applies to individual measurement depth levels; overall profile letter grades (A-F) are defined separately in Reference table 2a."
