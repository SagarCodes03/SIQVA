- id: float-cycle-and-depth
  question_examples:
  - How does an Argo float work and how deep does it go?
  - What is the standard float mission cycle?
  - How long does an Argo float profile take?
  answer: 'The standard Argo float operates on a recurring 10-day mission cycle that
    begins by sinking from the surface to a parking drift depth of 1000 meters. The
    float drifts passively with deep currents at 1000 meters for roughly 9 days before
    sinking further to its profile depth of 2000 meters. From 2000 meters, the float
    slowly rises to the ocean surface while recording measurements of conductivity,
    temperature, and pressure. Upon reaching the surface, the float obtains a position
    fix often through GPS and transmits its profile data to satellites during a surface
    interval between 15 minutes and one hour.

    '
  source_id: argo-how-floats-work
  section_or_page: Section "What does an Argo float do?"
  source_version: ''
  retrieved_on: '2026-11-14'
  limits: Covers standard core park-and-profile missions only; does not cover specialized
    biogeochemical 1-day bursts or Deep Argo missions down to 6000 meters. Fleetwide
    surface interval is 15 minutes to 1 hour (argo-how-floats-work); for Iridium floats
    specifically, surface transmission time is under 20 minutes compared to 6 to 18 hours
    for older Argos-2 floats (see float-telemetry-and-surface, Wong et al. 2020).
  related:
