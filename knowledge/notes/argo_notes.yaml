- id: adjusted-vs-raw-variables
  question_examples:
    - "What is the difference between raw and adjusted variables in Argo?"
    - "Should I use TEMP or TEMP_ADJUSTED?"
    - "Why are there adjusted fields in Argo netCDF files?"
  answer: >
    Argo netCDF data files store both the original raw sensor readings and scientifically adjusted variables in separate data columns.
    Raw parameter columns like TEMP and PSAL preserve the original transmitted observations exactly as recorded by the float.
    When calibrations or drift corrections are applied, the corrected numbers are written to corresponding fields such as TEMP_ADJUSTED and PSAL_ADJUSTED along with explicit error estimates.
    In delayed mode, adjusted values should always be used for scientific analysis because raw values may carry uncorrected sensor drift.
  source_id: argo-user-manual
  section_or_page: "Page 19-20, Section 2.2"
  source_version: "3.44.0"
  limits: "Does not explain sensor-specific adjustment formulas for optical biogeochemical sensors such as radiometers or fluorometers."
  related:
    - data-modes-rad
    - realtime-vs-delayed-qc
    - argopy-user-modes-overview
