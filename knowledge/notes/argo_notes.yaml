- id: argopy-user-modes-overview
  question_examples:
  - What are the user modes in argopy?
  - What is the difference between standard and research mode in argopy?
  - Which mode should I choose in argopy?
  answer: 'The argopy Python library provides three user modes—standard, research,
    and expert—to control data verbosity and quality filtering. Standard mode is the
    default mode in argopy and returns good or probably good data with QC flags 1
    and 2 from real-time or delayed mode. Research mode preserves only delayed-mode
    data of the highest quality carefully checked by human experts, admitting exclusively
    QC flag 1. Expert mode returns all raw Argo data without any postprocessing or
    quality filtering.

    '
  source_id: argopy-user-modes
  section_or_page: Section "Definitions" & Section "Standard mode (default)"
  source_version: ''
  retrieved_on: '2026-11-14'
  limits: Applies strictly to the argopy Python library fetching interface; underlying
    GDAC files remain unmodified NetCDF.
