- id: argo-data-policy-and-citation
  question_examples:
  - How do I cite Argo float data in a paper?
  - What is the official citation format for the Argo GDAC dataset?
  - Is Argo data free to use?
  answer: 'The citation of Argo data used in scientific studies requires specialized
    handling because the global dataset is dynamic, evolving and growing in time.
    To allow reproducibility of scientific studies that use Argo data, a snapshot
    of the entire dataset at the GDACs is preserved each month. Argo adopted a Digital
    Object Identifier format based on the master DOI 10.17882/42182 with unique monthly
    snapshot suffixes appended after a hash symbol. Authors cite an Argo snapshot
    by referencing the Argo Data Management Team, the snapshot date, and the specific
    snapshot DOI identifier.

    '
  source_id: wong2020
  section_or_page: 'Page 18, Section "HOW TO CITE ARGO DATA: THE DYNAMIC DOI STRUCTURE"'
  source_version: Vol. 7, Art. 700
  retrieved_on: '2026-11-14'
  limits: Covers global GDAC dataset citations; individual regional float providers
    or projects may also request acknowledgments in project metadata.
  related:
