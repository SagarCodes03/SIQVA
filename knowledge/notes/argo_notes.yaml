- id: conservative-temperature
  question_examples:
  - What inputs does Conservative Temperature accompany in GSW?
  - What units and scale are used for Conservative Temperature in GSW?
  - How do array dimensions of Conservative Temperature and Absolute Salinity relate in GSW?
  answer: 'In the Gibbs SeaWater oceanographic toolbox, Conservative Temperature (symbol
    CT) is defined on the ITS-90 temperature scale in units of degrees Celsius. Conservative
    Temperature serves alongside Absolute Salinity (SA in g/kg) and sea pressure (p
    in dbar) as a required input for calculating seawater sound speed and specific
    volume. In GSW function calculations, the array dimensions of Conservative Temperature
    and Absolute Salinity must match each other.

    '
  source_id: gsw-sound-speed
  section_or_page: Section "INPUT" & Section "DESCRIPTION"
  source_version: '3.05'
  retrieved_on: '2026-11-14'
  limits: Derived thermodynamic relations connecting Conservative Temperature to potential
    enthalpy require the TEOS-10 Manual / Primer, which is not currently retrieved.
  related:
