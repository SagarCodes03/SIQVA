- id: what-is-teos-10
  question_examples:
  - What is TEOS-10 and why is it used in oceanography?
  - What is the difference between TEOS-10 and EOS-80?
  - Why did oceanographers replace EOS-80?
  answer: 'TEOS-10 is the Thermodynamic Equation of Seawater 2010 adopted in 2009
    by the Intergovernmental Oceanographic Commission to replace EOS-80 as the official
    description of seawater. It is based on a Gibbs function formulation from which
    all thermodynamic properties of seawater, including density, enthalpy, entropy,
    and sound speed, can be derived in a thermodynamically consistent manner. A significant
    change compared with past practice is that TEOS-10 uses Absolute Salinity (mass
    fraction of salt in g/kg) as opposed to conductivity-based Practical Salinity
    to describe salt content. While Absolute Salinity is needed to compute density
    and other properties, Practical Salinity on PSS-78 continues to be the measured
    variable archived in national databases.

    '
  source_id: teos10-site
  section_or_page: Section "HOME"
  source_version: ''
  retrieved_on: '2026-11-14'
  limits: Covers thermodynamic standards; does not cover biological or geochemical
    nutrient interactions beyond inorganic thermodynamic properties.
  related:
  - practical-vs-absolute-salinity
  - conservative-temperature
  - gsw-sound-speed-inputs
  verified: false
  checked_on: ''
- id: practical-vs-absolute-salinity
  question_examples:
  - What is the difference between Practical Salinity and Absolute Salinity?
  - Why does TEOS-10 use Absolute Salinity?
  - What are the units of Practical Salinity vs Absolute Salinity?
  answer: 'TEOS-10 defines salt content using Absolute Salinity (symbol SA), which
    represents the mass fraction of salt in seawater expressed in SI units of g/kg.
    In contrast, Practical Salinity (symbol SP) under PSS-78 is a dimensionless quantity
    that serves essentially as a measure of seawater electrical conductivity. Spatial
    variations in the composition of seawater mean that Absolute Salinity is not simply
    proportional to Practical Salinity across the ocean. Thermodynamic properties
    such as density and enthalpy are correctly expressed as functions of Absolute
    Salinity, while measured Practical Salinity continues to be archived in databases.

    '
  source_id: teos10-site
  section_or_page: Section "HOME"
  source_version: ''
  retrieved_on: '2026-11-14'
  limits: Covers standard open-ocean thermodynamic salinity definitions; coastal estuarine
    chemistry anomalies require localized composition models.
