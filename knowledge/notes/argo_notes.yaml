- id: deep-argo-depth
  question_examples:
    - "How deep do Deep Argo floats dive?"
    - "What is Deep Argo and why was it developed?"
    - "Can Argo measure below 2000 meters?"
  answer: >
    Deep Argo was developed to sample the ocean interior below the 2000-meter ceiling of the standard core Argo array down to the abyssal ocean floor at 6000 meters.
    Standard core floats sample approximately the upper half of the global ocean volume, leaving deep and abyssal water masses unmonitored by autonomous floats.
    Deep Argo floats utilize reinforced glass or titanium pressure hulls and specialized high-pressure CTD sensor heads to withstand extreme abyssal pressures.
    These deep observations are vital for quantifying deep-ocean warming rates, global sea-level rise acceleration, and the slow overturning of Antarctic Bottom Water.
  source_id: roemmich2019
  section_or_page: "Page 2, Section 'INTRODUCTION'"
  source_version: "Vol. 6, Art. 439"
  limits: "Covers Deep Argo design and depth limits; does not cover core Argo float pressure limits (2000 dbar)."
