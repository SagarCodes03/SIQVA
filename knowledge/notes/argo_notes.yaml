- id: float-telemetry-and-surface
  question_examples:
  - How do Argo floats send their data back to land?
  - How long do Argo floats spend on the surface?
  - Do Argo floats use satellites or radio to transmit data?
  answer: 'Argo floats transmit their ocean observations to ground stations using
    satellite telecommunication systems whenever they surface. Early generation floats
    used one-way Argos-2 satellite transmission, which required floats to drift on
    the sea surface for 6 to 18 hours to guarantee error-free data reception. At present,
    the majority of active floats use bidirectional Iridium satellite communications,
    which reduces time spent on the sea surface to less than 20 minutes for each cycle.
    Two-way communication via Iridium makes it possible to send instructions to the
    float for troubleshooting or for changing the float''s sampling mission.

    '
  source_id: wong2020
  section_or_page: Pages 5–6, Section "Satellite Communications"
  source_version: Vol. 7, Art. 700
  retrieved_on: '2026-11-14'
  limits: Covers Argos and Iridium satellite systems; does not cover experimental
    acoustic underwater positioning networks used beneath Antarctic sea ice. Surface
    transmission time under 20 minutes applies to modern bidirectional Iridium floats
    (compared to 6–18 h for Argos-2); the broader fleet overview describes the typical
    surface interval as 15 minutes to one hour (see float-cycle-and-depth).
  related:
