- id: adjusted-vs-raw-variables
  question_examples:
  - What is the difference between TEMP and TEMP_ADJUSTED?
  - Why are there adjusted variables in Argo files?
  - Which variable should researchers use in Argo netCDF files?
  answer: 'In Argo netCDF profile files, the <PARAM> variable contains the raw values
    transmitted by the float, which should never be altered. The variable <PARAM>_QC
    records quality control flags that pertain to the raw values in <PARAM>. The mandatory
    variable <PARAM>_ADJUSTED contains values derived from the original parameter
    after applying sensor adjustments. When no adjustment has been performed on a
    parameter, the FillValue is inserted into <PARAM>_ADJUSTED and <PARAM>_ADJUSTED_ERROR.

    '
  source_id: argo-user-manual
  section_or_page: Pages 23–25, Section 2.2.5 "Measurements for each profile"
  source_version: 3.44.0
  retrieved_on: '2026-11-14'
  limits: Covers variable naming in Argo NetCDF profile files; does not detail algorithmic
    calibration methods (such as OWC for salinity).
  related:
  - data-modes-rad
  - qc-flag-scale
  verified: false
