    - realtime-vs-delayed-qc
    - adjusted-vs-raw-variables
  verified: false
  checked_on: ""

- id: delayed-mode-timing
  question_examples:
    - "Why are recent Argo profiles not in delayed mode?"
    - "How long does it take for Argo data to reach delayed mode?"
    - "When will last month's profiles be calibrated in delayed mode?"
  answer: >
    Recent Argo observations cannot be processed into delayed mode immediately because detecting sensor drift requires evaluating a long time series of profiles.
    The established protocol in the Argo program is to perform initial delayed-mode analysis roughly 12 months after profile collection.
    This waiting window allows oceanographers to compare the float's evolving sensor behavior against neighboring floats and high-quality reference shipboard casts.
    Profiles are subsequently revisited multiple times as additional cycles accumulate until the float ceases operations.
  source_id: wong2020
  section_or_page: "Page 8, Section 'Delayed-Mode'"
  source_version: "Vol. 7, Art. 700"
  limits: "Applies to standard core CTD drift evaluation; fast-turnaround pilot projects or rapid sensor failures may receive earlier flagging."
  related:
    - data-modes-rad
    - realtime-vs-delayed-qc
  verified: false
  checked_on: ""

- id: realtime-vs-delayed-qc
  question_examples:
    - "What is the difference between real-time and delayed-mode quality control?"
    - "Can I use real-time Argo data for climate research?"
    - "How does delayed-mode quality control improve on automated tests?"
  answer: >
    Real-time quality control relies entirely on automated, computer-driven checks completed within 24 hours to quickly catch gross sensor failures and transmission corruption.
    These automated real-time checks are designed for operational weather and ocean prediction systems that require fast updates over absolute perfection.
    In contrast, delayed-mode quality control incorporates careful visual review by regional oceanographic experts and statistical comparison against historical hydrography.
    Delayed mode corrects subtle sensor calibration drifts and supplies rigorous scientific error estimates suitable for long-term climate studies.
  source_id: wong2020
  section_or_page: "Page 8, Section 'Delayed-Mode'"
  source_version: "Vol. 7, Art. 700"
  limits: "Does not detail individual real-time test parameters such as spike thresholds, density inversion limits, or regional climatology envelopes."
