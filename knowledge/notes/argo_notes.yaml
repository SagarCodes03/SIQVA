- id: bgc-argo-parameters
  question_examples:
    - "What extra sensors are installed on Biogeochemical Argo floats?"
    - "What variables does BGC-Argo measure?"
    - "How does Biogeochemical Argo differ from core Argo?"
  answer: >
    Biogeochemical Argo expands core physical observations by equipping floats with specialized sensors measuring essential ocean biological and chemical parameters.
    The six standard core biogeochemical variables approved for the global BGC array are dissolved oxygen, nitrate, pH, chlorophyll-a fluorescence, optical backscattering, and downwelling irradiance.
    These observations allow scientists to investigate ocean acidification, carbon export, oxygen minimum zones, and marine ecosystem productivity across seasonal cycles.
    Because biogeochemical sensors possess unique sensor drifts and response dynamics, they undergo dedicated real-time and delayed-mode quality control procedures.
  source_id: argo-qc-bgc
  section_or_page: "Page 5, Section 1"
  source_version: "1.1"
  limits: "Covers standard global BGC variables; experimental sensors such as acoustic fish trackers or imaging cytometers follow auxiliary data protocols."
