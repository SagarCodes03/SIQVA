- id: argo-gdac-structure
  question_examples:
    - "What is an Argo GDAC and where are they located?"
    - "How is Argo data synchronized between servers?"
    - "Where are the official Argo data repositories hosted?"
  answer: >
    The international Argo data management architecture relies on two mirror Global Data Assembly Centres (GDACs) that serve as public access points for all array data.
    The French GDAC is hosted at the Coriolis data center in Brest, France, and the US GDAC is operated by the Fleet Numerical Meteorology and Oceanography Center in Monterey, California.
    Both GDACs receive standardized netCDF profiles from national Data Assembly Centres around the world and synchronize their complete holdings daily.
    This dual-server mirroring guarantees data redundancy, continuous public availability, and consistent archive synchronization across the international scientific community.
  source_id: wong2020
  section_or_page: "Page 7, Section 'THE ARGO DATA SYSTEM'"
  source_version: "Vol. 7, Art. 700"
  limits: "Describes global data assembly centers; does not detail initial satellite telemetry decoding performed upstream by national Data Assembly Centres (DACs)."
  related:
