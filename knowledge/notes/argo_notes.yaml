- id: float-telemetry-and-surface
  question_examples:
    - "How do Argo floats send their data back to land?"
    - "How long do Argo floats spend on the surface?"
    - "Do Argo floats use satellites or radio to transmit data?"
  answer: >
    Argo floats transmit their recorded ocean profiles back to ground stations using satellite telecommunication systems whenever they reach the sea surface.
    Early generation floats relied on unidirectional Argos satellite telemetry, which required floats to drift on the surface for up to 8 to 12 hours to ensure data transmission.
    Modern floats utilize bidirectional Iridium satellite communications, allowing them to upload dense data profiles and receive new mission commands within 15 to 60 minutes.
    Minimizing surface residence time dramatically reduces the hazard of ship collisions, biofouling, and wave-induced sensor damage.
  source_id: wong2020
  section_or_page: "Page 6, Section 'THE ARGO DATA SYSTEM'"
  source_version: "Vol. 7, Art. 700"
  limits: "Covers Argos and Iridium satellite systems; does not cover experimental acoustic underwater positioning networks used beneath Antarctic sea ice."
  related:
    - float-cycle-and-depth
    - argo-one-paragraph
  verified: false
