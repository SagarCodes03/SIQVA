- id: argo-one-paragraph
  question_examples:
  - What is the Argo program?
  - Explain Argo in simple terms.
  - What does the Argo observation network do?
  answer: 'Argo is an international real-time in situ ocean observing array consisting
    of nearly 4000 autonomous robotic floats distributed across the global ocean.
    These free-drifting robotic probes measure seawater pressure, temperature, and
    salinity from the surface down to a depth of 2000 meters every 10 days. Data collected
    by the array are relayed by satellite communication to data centers and made freely
    available on the web in less than 24 hours.

    '
  source_id: argopy-what-is-argo
  section_or_page: Section "What is Argo ?"
  source_version: ''
  retrieved_on: '2026-11-14'
  limits: Does not cover experimental sensors, shipboard CTD calibration methods,
    or localized coastal moorings outside the open ocean array.
