- id: noaa-cpc-nino-definitions
  question_examples:
    - "What are the geographic boundaries of the Nino regions?"
    - "How does NOAA define Nino 3.4 and Nino 1+2?"
    - "What coordinates define the El Nino monitoring areas?"
  answer: >
    The NOAA Climate Prediction Center defines standard geographic bounding boxes across the equatorial Pacific to monitor El Nino and La Nina events.
    The Nino 1+2 region is bounded by latitudes 0 to 10 degrees South and longitudes 90 to 80 degrees West off the coast of South America.
    Nino 3 spans latitudes 5 degrees North to 5 degrees South and longitudes 150 to 90 degrees West in the eastern tropical Pacific.
    Nino 3.4 encompasses latitudes 5 degrees North to 5 degrees South and longitudes 170 to 120 degrees West, serving as the benchmark index area for tropical Pacific ocean-atmosphere coupling.
  source_id: noaa-cpc-nino
  section_or_page: 'Section "Introduction"'
