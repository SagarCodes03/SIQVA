- id: profile-quality-flags
  question_examples:
  - What do the profile quality flags A through F mean?
  - How is the overall quality of an Argo profile determined?
  - What percentage of good data is required for profile flag A?
  answer: 'Argo assigns an overall profile quality letter flag from A to F based on
    the percentage N of levels containing good data, defined in Reference table 2a.
    In calculating N, levels with QC flags 1, 2, 5, and 8 are counted as good data,
    levels with flags 3 and 4 are counted as bad data, and flags 0, 9, or FillValue
    are not used. Grade A requires N = 100% where all levels contain good data, Grade
    B spans 75% <= N < 100%, Grade C covers 50% <= N < 75%, Grade D spans 25% <= N
    < 50%, Grade E covers 0% < N < 25%, and Grade F indicates N = 0% where no levels
    have good data. An empty space FillValue is assigned when no QC is performed or
    no usable flag values are present in the profile.

    '
  source_id: argo-user-manual
  section_or_page: 'Page 77, Section 3.2.2 "Reference table 2a: overall profile quality
    flag"'
  source_version: 3.44.0
  retrieved_on: '2026-11-14'
  limits: Applies to whole-profile summary quality; individual measurement levels
    are flagged using Reference table 2.
  related:
  - qc-flag-scale
  - data-modes-rad
  verified: false
