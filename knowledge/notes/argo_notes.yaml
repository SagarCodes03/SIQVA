- id: argo-array-size-and-coverage
  question_examples:
  - How many floats are in the Argo array?
  - What is the spatial coverage and resolution of Argo?
  - How many profiles does Argo collect per day?
  answer: 'The international Argo network maintains nearly 4000 autonomous profiling
    floats distributed across the global ocean. The geographic locations of these
    robotic probes are distributed between the 60th parallels to provide seasonally
    and regionally unbiased measurements. The global array reached its target coverage
    of one profile per month per 3 degree by 3 degree horizontal area in 2007. Operating
    continuously, the observation array provides more than 400 in situ vertical profiles
    per day.

    '
