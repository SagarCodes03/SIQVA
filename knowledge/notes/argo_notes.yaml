- id: deep-argo-depth
  question_examples:
  - How deep do Deep Argo floats dive?
  - What is Deep Argo and why was it developed?
  - Can Argo measure below 2000 meters?
  answer: 'Deep Argo was developed to sample the ocean interior below the 2000-dbar
    limit of the core array down to the abyssal ocean floor at 6000 dbar. Standard
    core floats sample approximately the upper half of ocean volume, leaving deep
    and abyssal water masses below 2000 dbar unmonitored by autonomous floats. Development
    of floats and CTDs capable of accurate measurements to 6000 dbar enables sampling
    of bottom-intensified ocean variability. Antarctic Bottom Water below 2000 dbar
    has been warming and freshening over recent decades, contributing directly to
    steric sea level rise.

    '
  source_id: roemmich2019
  section_or_page: Page 7, Section "Deep Argo"
  source_version: Vol. 6, Art. 439
  retrieved_on: '2026-11-14'
  limits: Covers Deep Argo design and depth limits; does not cover core Argo float
    pressure limits (2000 dbar).
