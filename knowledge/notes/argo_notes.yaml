- id: gsw-sound-speed-inputs
  question_examples:
    - "What inputs are needed to calculate sound speed in GSW?"
    - "How is sound speed calculated in the Gibbs SeaWater toolbox?"
    - "What parameters does gsw_sound_speed require?"
  answer: >
    The Gibbs SeaWater function gsw_sound_speed requires three physical oceanographic inputs: Absolute Salinity (SA in g/kg), Conservative Temperature (CT in degrees Celsius), and sea pressure (p in dbar).
    Sea pressure represents gauge pressure relative to the ocean surface, defined as absolute pressure minus standard atmospheric pressure of 10.1325 dbar.
    The function calculates the resulting sound speed in meters per second (m/s) using an efficient 75-term polynomial approximation of specific volume.
    The formulation provides high numerical accuracy inside standard oceanographic ranges and is valid for all open-ocean temperature and salinity combinations.
  source_id: gsw-sound-speed
  section_or_page: 'Section "Introduction"'
  source_version: ""
  limits: "The 75-term polynomial equation is optimized for standard ocean ranges; extreme high-pressure laboratory experiments outside the oceanographic funnel may require 48-term exact Gibbs evaluations."
  related:
    - what-is-teos-10
    - conservative-temperature
    - practical-vs-absolute-salinity
  verified: false
