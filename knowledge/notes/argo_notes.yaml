- id: core-argo-parameters
  question_examples:
  - What parameters do core Argo floats measure?
  - What sensors are mounted on a standard Argo float?
  - What are the primary physical variables collected by Argo?
  answer: 'On top of every core Argo profiling float is a Conductivity, Temperature,
    Depth (CTD) sensor package to measure physical seawater properties. The sensor
    measures temperature within an accuracy of 0.001 degrees Celsius and pressure
    within 0.1 dbar. Salinity is calculated from measured conductivity, temperature,
    and pressure within an accuracy of 0.001 practical salinity units. These measurements
    are gathered as the float moves up through the water column back to the ocean
    surface.

    '
  source_id: argo-how-floats-work
  section_or_page: Section "What is in an Argo float?"
  source_version: ''
  retrieved_on: '2026-11-14'
  limits: Covers core CTD parameters; biogeochemical variables (oxygen, nitrate, pH,
    bio-optics) follow separate BGC-Argo sensor specifications.
  related:
