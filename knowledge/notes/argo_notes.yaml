- id: profile-quality-flags
  question_examples:
    - "What do the profile quality letters A through F mean in Argo?"
    - "How is PROFILE_TEMP_QC calculated?"
    - "What is an overall profile quality flag?"
  answer: >
    Argo assigns an overall profile quality letter flag from A to F based on the proportion of measurement levels that contain good data.
    Grade A indicates that 100 percent of the profile's levels contain good data with QC flags of 1, 2, 5, or 8.
    Grade B denotes profiles where 75 to 99 percent of levels are good, while Grade C covers 50 to 74 percent, and Grade F indicates zero good levels.
    Levels flagged as missing (flag 9) or uninspected (flag 0) are excluded from the percentage denominator during calculation.
  source_id: argo-user-manual
  section_or_page: "Page 77, Reference table 2a"
  source_version: "3.44.0"
  limits: "Applies to whole-profile summary quality; individual depths retain their own level-specific numerical flags (0-9)."
