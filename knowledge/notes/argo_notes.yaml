- id: noaa-cpc-nino-definitions
  question_examples:
  - What are the geographic boundaries of the Nino regions?
  - How does NOAA define Nino 3.4 and Nino 1+2?
  - What coordinates define the El Nino monitoring areas?
  answer: 'The NOAA Climate Prediction Center defines standard oceanic coordinate
    boundaries in the tropical Pacific to monitor sea surface temperature indices.
    The Niño 1+2 region is bounded by latitudes 0 to 10°South and longitudes 90°West
    to 80°West off the coast of South America. The Niño 3 region spans latitudes 5°North
    to 5°South and longitudes 150°West to 90°West in the eastern tropical Pacific.
    The Niño 3.4 region spans latitudes 5°North to 5°South and longitudes 170°West
    to 120°West, while Niño 4 encompasses latitudes 5°North to 5°South and longitudes
    160°East to 150°West.

    '
  source_id: noaa-cpc-nino
