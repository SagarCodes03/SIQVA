- id: argopy-user-modes-overview
  question_examples:
    - "What are the argopy user modes research, standard, and expert?"
    - "What is the difference between research mode and standard mode in argopy?"
    - "How does argopy filter Argo data by default?"
  answer: >
    The argopy library provides three distinct user modes designed to simplify data access according to the user's research needs.
    Expert mode returns all raw observations without applying any postprocessing, data mode filters, or QC flag removals.
    Standard mode simplifies parameter names, merges available adjustments, and filters profiles to retain good and probably good measurements (QC 1 and 2).
    Research mode applies the strictest scientific filtering, accepting delayed-mode profiles only (mode D) and keeping strictly QC flag 1 observations.
  source_id: argopy-user-modes
  section_or_page: 'Section "Definitions"'
  source_version: ""
  limits: "Reflects the client-side data fetching library argopy; does not alter underlying netCDF files hosted on the raw GDAC servers."
