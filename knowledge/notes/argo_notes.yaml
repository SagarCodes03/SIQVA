- id: core-argo-parameters
  question_examples:
    - "What sensors do standard Argo floats carry?"
    - "What variables are measured by a core Argo float?"
    - "What physical parameters are measured during an Argo dive?"
  answer: >
    Core Argo profiling floats are equipped with high-precision CTD sensor packages that measure electrical conductivity, in situ temperature, and hydrostatic pressure.
    These primary observations are used directly by oceanographers to compute practical salinity, density, and sound velocity throughout the water column.
    Pressure is measured in decibars, temperature is reported in degrees Celsius on the ITS-90 scale, and conductivity is used to compute salinity on the PSS-78 scale.
    Measurements are collected during the float's controlled upward ascent from 2000 meters to the ocean surface.
  source_id: argo-how-floats-work
  section_or_page: 'Section "What does an Argo float do?"'
  source_version: ""
  limits: "Covers physical CTD sensor packages only; does not cover specialized biogeochemical sensors such as oxygen optodes, radiometers, or pH electrodes."
