- id: qc-flag-1-definition
  question_examples:
    - "What does QC flag 1 mean in Argo?"
    - "What qualifies as good data in Argo quality control?"
    - "When is a measurement assigned flag 1?"
  answer: >
    QC flag 1 represents good data that have successfully satisfied all automated quality control tests or expert delayed-mode evaluations.
    In real-time processing, flag 1 indicates that an observation passed every automated screening check within the limits of the real-time test suite.
    In delayed mode, flag 1 signifies that no sensor adjustment was necessary, or that the adjusted value is statistically consistent with high-quality reference data.
    Only measurements with QC flag 1 are admitted into research-mode analyses requiring the highest standard of scientific integrity.
  source_id: argo-user-manual
  section_or_page: "Page 76, Reference table 2"
  source_version: "3.44.0"
  limits: "Applies to observation levels; entire profiles containing only flag 1 levels receive a summary profile grade of A."
  related:
    - qc-flag-scale
    - qc-flag-4-definition
    - profile-quality-flags
  verified: false
  checked_on: ""

- id: qc-flag-4-definition
  question_examples:
    - "What does QC flag 4 mean in Argo?"
    - "Can I use measurements with QC flag 4?"
    - "Why is an Argo observation marked with flag 4?"
  answer: >
    QC flag 4 denotes bad data that have failed one or more critical quality control tests and are considered completely unusable for scientific research.
    In real-time processing, flag 4 is assigned when a measurement violates gross physical thresholds, such as impossible global ranges, severe spikes, or extreme density inversions.
    In delayed-mode processing, flag 4 is applied to data that cannot be scientifically adjusted, such as readings compromised by catastrophic sensor failure or uncorrectable biofouling.
    When delayed-mode adjustments cannot salvage an observation, the adjusted parameter value is replaced with a missing data FillValue.
  source_id: argo-user-manual
  section_or_page: "Page 76, Reference table 2"
  source_version: "3.44.0"
  limits: "Flag 4 applies strictly to bad, non-adjustable points; potentially salvageable drifts that can be calibrated later receive flag 3."
  related:
    - qc-flag-scale
    - qc-flag-1-definition
  verified: false
