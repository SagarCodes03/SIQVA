- id: argo-one-paragraph
  question_examples:
    - "What is the Argo program?"
    - "Explain Argo in simple terms."
    - "What does the Argo observation network do?"
  answer: >
    Argo is an international real-time in situ ocean observing array consisting of nearly 4000 autonomous robotic floats distributed across the ice-free global ocean.
    These free-drifting robotic probes measure seawater pressure, temperature, and electrical conductivity from the surface down to a depth of 2000 meters every 10 days.
    Data collected by the array are relayed by satellite communication to global data assembly centers and made freely available to researchers and forecasting centers within 24 hours of collection.
  source_id: argopy-what-is-argo
  section_or_page: 'Section "What is Argo ?"'
  source_version: ""
  limits: "Does not cover experimental sensors, shipboard CTD calibration methods, or localized coastal moorings outside the open ocean array."
