- id: what-is-teos-10
  question_examples:
    - "What is TEOS-10 and why is it used in oceanography?"
    - "What is the difference between TEOS-10 and EOS-80?"
    - "Why did oceanographers replace EOS-80?"
  answer: >
    TEOS-10 is the international Thermodynamic Equation of Seawater adopted in 2009 by the Intergovernmental Oceanographic Commission to replace the older EOS-80 standard.
    It is formulated from a Gibbs thermodynamic potential function that allows all seawater properties—including density, sound speed, enthalpy, and entropy—to be derived consistently.
    Unlike EOS-80, TEOS-10 accounts for spatial variations in seawater composition by expressing properties as functions of Absolute Salinity rather than electrical conductivity.
    This formulation ensures that thermodynamic calculations satisfy fundamental physical conservation laws during mixing and heat exchange.
  source_id: teos10-site
  section_or_page: 'Section "Introduction"'
  source_version: ""
  limits: "Covers thermodynamic standards; does not cover biological or geochemical nutrient interactions beyond inorganic thermodynamic properties."
  related:
    - practical-vs-absolute-salinity
    - conservative-temperature
    - gsw-sound-speed-inputs
  verified: false
  checked_on: ""

- id: practical-vs-absolute-salinity
  question_examples:
    - "What is the difference between Practical Salinity and Absolute Salinity?"
    - "Why does TEOS-10 use Absolute Salinity instead of Practical Salinity?"
    - "What units are used for Practical Salinity and Absolute Salinity?"
  answer: >
    Practical Salinity represents a dimensionless ratio derived from electrical conductivity measurements on the Practical Salinity Scale 1978 (PSS-78).
    In contrast, Absolute Salinity measures the actual mass fraction of dissolved material in seawater, expressed in SI units of grams per kilogram (g/kg).
    Because the relative composition of dissolved sea salts varies across different ocean basins, Practical Salinity is not strictly proportional to dissolved mass everywhere.
    TEOS-10 computes Absolute Salinity by applying regional composition anomaly corrections to Practical Salinity before calculating density and other thermodynamic properties.
  source_id: teos10-site
  section_or_page: 'Section "Introduction"'
  source_version: ""
  limits: "Covers standard open-ocean composition anomaly corrections; marginal seas like the Baltic Sea require special non-standard anomaly formulations."
  related:
    - what-is-teos-10
    - conservative-temperature
  verified: false
  checked_on: ""

- id: conservative-temperature
  question_examples:
    - "What is Conservative Temperature in TEOS-10?"
    - "Why is Conservative Temperature used instead of potential temperature?"
    - "How does Conservative Temperature relate to ocean heat content?"
  answer: >
    Conservative Temperature is the thermodynamic temperature variable in TEOS-10 that represents the heat content per unit mass of seawater.
    It is computed directly from potential enthalpy and is expressed in units of degrees Celsius on the ITS-90 temperature scale.
    Unlike in situ temperature or potential temperature, Conservative Temperature is conserved when seawater parcels mix under turbulent ocean processes.
    Using Conservative Temperature substantially reduces errors when calculating global ocean heat content and thermodynamic budgets.
  source_id: teos10-site
  section_or_page: 'Section "Introduction"'
  source_version: ""
  limits: "Does not cover non-adiabatic biological heat sources or phase transitions involving sea ice formation."
  related:
