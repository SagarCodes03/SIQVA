- id: gsw-sound-speed-inputs
  question_examples:
  - What inputs are needed to calculate sound speed in GSW?
  - How is sound speed calculated in the Gibbs SeaWater toolbox?
  - What parameters does gsw_sound_speed require?
  answer: 'The Gibbs SeaWater function gsw_sound_speed requires three oceanographic
    inputs: Absolute Salinity (SA in g/kg), Conservative Temperature (CT in degrees
    Celsius on ITS-90), and sea pressure (p in dbar). Sea pressure is gauge pressure
    relative to the surface, representing absolute pressure minus standard atmospheric
    pressure of 10.1325 dbar. The function calculates speed of sound in seawater in
    meters per second using a computationally efficient 75-term polynomial expression
    for specific volume. This 75-term equation has been fitted in a restricted parameter
    range and is most accurate inside the oceanographic funnel described in McDougall
    et al. (2003).

    '
  source_id: gsw-sound-speed
  section_or_page: Section "USAGE" & Section "DESCRIPTION"
  source_version: '3.05'
  retrieved_on: '2026-11-14'
  limits: The GSW library function gsw_infunnel(SA,CT,p) is available to test whether
    data lie outside the oceanographic funnel.
