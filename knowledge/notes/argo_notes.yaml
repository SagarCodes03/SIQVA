- id: qc-flag-scale
  aliases:
  - qc-flag-1-definition
  - qc-flag-4-definition
  question_examples:
  - What do the Argo quality control flags mean?
  - Explain the 0 to 9 Argo QC flag scale.
  - What is the difference between flag 1 and flag 4 in Argo?
  answer: 'Argo quality control evaluates individual observation levels on a numerical
    scale from 0 to 9 as specified in Reference table 2 of the Argo User''s Manual.
    Flag 0 indicates no QC was performed, flag 1 represents good data where all real-time
    tests passed, flag 2 marks probably good data to be used with caution, and flag
    3 denotes probably bad data that are potentially adjustable. Flag 4 denotes bad
    data that must not be used, flag 5 indicates value changed, flags 6 and 7 are
    not used, flag 8 marks estimated values, and flag 9 represents missing values.
    In delayed mode, flag 1 signifies that no adjustment is needed or that the value
    is statistically consistent with good quality reference data, whereas unadjustable
    flag 4 data are replaced by FillValue.

    '
  source_id: argo-user-manual
  section_or_page: 'Page 76, Section 3.2.1 "Reference table 2: quality control flag
    scale"'
  source_version: 3.44.0
  retrieved_on: '2026-11-14'
  limits: Applies to individual measurement depth levels; overall profile letter grades
    (A-F) are defined separately in Reference table 2a.
  related:
  - profile-quality-flags
  - data-modes-rad
  - adjusted-vs-raw-variables
  verified: false
  checked_on: ''
- id: data-modes-rad
  question_examples:
  - What are data modes R, A, and D in Argo?
  - What is the difference between real-time and delayed mode?
  - What does DATA_MODE mean in an Argo netCDF file?
  answer: 'Data from Argo floats are classified into three operational categories
    denoted by DATA_MODE values of ''R'', ''A'', or ''D''. Real-time raw data (DATA_MODE
    = ''R'') pass through automatic quality control procedures with a target issuance
    to GDACs within 12 hours of surfacing. Real-time adjusted data (DATA_MODE = ''A'')
    contain interim automated adjustments applied to raw data before delayed-mode
    assessment. Delayed-mode data (DATA_MODE = ''D'') are assessed by scientists who
    evaluate long-term sensor stability and apply necessary adjustments, with a target
    GDAC availability of about 12 months after transmission for core CTD data.

    '
  source_id: argo-user-manual
  section_or_page: Page 16, Section 1.7 "Real-time, real-time adjusted data and delayed
    mode data"
  source_version: 3.44.0
  retrieved_on: '2026-11-14'
  limits: Describes data mode classification; does not detail specific delayed-mode
    salinity drift fitting algorithms (e.g., OWC method).
  related:
  - qc-flag-scale
  - adjusted-vs-raw-variables
  - delayed-mode-timing
  verified: false
  checked_on: ''
- id: delayed-mode-timing
  question_examples:
  - Why are recent Argo profiles not in delayed mode?
  - How long does it take for Argo data to reach delayed mode?
  - When will last month's profiles be calibrated in delayed mode?
  answer: 'Recent Argo observations cannot be processed into delayed mode immediately
    because determining sensor drift requires the accumulation of a relatively long
    time series. In Argo, the established practice is to examine float profiles in
    delayed mode initially about 12 months after they are collected. Because retrieving
    floats for recalibration is rarely possible, oceanographers use statistical tools
    and climatological comparisons to adjust data for sensor drift. Profiles are subsequently
    revisited several times as more data from the floats are obtained until the floats
    become inactive.

    '
  source_id: wong2020
  section_or_page: Page 8, Section "Delayed-Mode"
  source_version: Vol. 7, Art. 700
  retrieved_on: '2026-11-14'
  limits: Applies to standard core CTD drift evaluation; fast-turnaround pilot projects
    or rapid sensor failures may receive earlier flagging.
  related:
  - data-modes-rad
  - realtime-vs-delayed-qc
  verified: false
  checked_on: ''
- id: realtime-vs-delayed-qc
  question_examples:
  - What is the difference between real-time and delayed-mode QC in Argo?
  - Why does delayed mode take so long compared to real-time QC?
  - Can I use real-time Argo data for climate research?
  answer: 'Real-time quality control applies automated procedures to deliver flagged
    data within 24 hours of satellite transmission. These automated real-time checks
    serve operational weather and ocean forecasting where timely data delivery is
    required. In contrast, delayed-mode quality control subjects observations to visual
    examination by oceanographic experts because automatic real-time procedures are
    not flawless. The delayed-mode pathway aims to provide the highest-quality version
    of the data including realistic error estimates suitable for climate research.

    '
  source_id: wong2020
  section_or_page: Page 8, Section "Delayed-Mode"
  source_version: Vol. 7, Art. 700
  retrieved_on: '2026-11-14'
  limits: Does not detail individual real-time test parameters such as spike thresholds,
    density inversion limits, or regional climatology envelopes.
  related:
