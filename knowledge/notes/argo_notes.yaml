- id: argo-data-policy-and-citation
  question_examples:
    - "How do I cite Argo float data in a paper?"
    - "What is the official citation format for the Argo GDAC dataset?"
    - "Is Argo data free to use?"
  answer: >
    All Argo data are publicly available free of charge without any commercial or geographical restrictions within 24 hours of collection.
    Because the Argo dataset grows continuously, research studies cite dynamic snapshots using the master Digital Object Identifier 10.17882/42182.
    For reproducible science, authors cite a specific monthly snapshot by appending the snapshot identifier with a hash symbol, such as doi:10.17882/42182#66797.
    Formal citations credit the Argo Data Management Team and reference the snapshot creation date.
  source_id: wong2020
  section_or_page: "Page 18, Section 'HOW TO CITE ARGO DATA'"
  source_version: "Vol. 7, Art. 700"
  limits: "Covers global GDAC dataset citations; individual regional float providers or projects may also request acknowledgments in project metadata."
