- id: siqva-data-sources-caching
  question_examples:
  - Where does SIQVA get its ocean data from?
  - How does caching work in SIQVA?
  - How fresh is the local float index snapshot?
  - What information is stored in the local float index?
  answer: SIQVA retrieves in situ Argo profiles through argopy from ERDDAP and GDAC
    servers and caches normalized datasets locally in Parquet format keyed by a SHA-256
    hash of the query spec. The local float index stores platform number (wmo), cycle,
    date, latitude, longitude, ocean basin, institution, and delayed-mode status for
    indexed profiles. The query planner uses this index to count matching profiles,
    map float trajectories, and perform space-time stratified profile sampling without
    querying remote servers. The float index is a static snapshot with a build date
    displayed in the application UI, and it requires periodic rebuilding from GDAC
    directory files to remain fresh.
  source_code_path: src/siqva/fetcher.py, src/siqva/floatindex.py, scripts/build_float_index.py
