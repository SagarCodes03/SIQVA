  answer: 'The ''Understood as'' header displays interpreted query parameters with
    provenance labels [rules], [llm], or [default]. Default depth ranges apply only
    when the user specifies no depth in the query, whereas any user-specified depth
    overrides the default. Default depths defined in capabilities are: 0–20 dbar for
    drift; 0–2000 dbar for acoustic; 0–500 dbar for profile, ts, trend, thermocline,
