- id: siqva-qc-data-modes
  question_examples:
  - What quality control data modes does SIQVA offer?
  - What is the difference between research, standard, and expert mode in SIQVA?
  - Which QC flags are excluded in research and standard mode?
  answer: 'SIQVA provides three explicit quality control data delivery modes: research,
    standard, and expert. Research mode (delayed-mode only, QC=1 only, adjusted values
    merged) enforces that strict qc=1 only (good data); all other flags and real-time
    records excluded. Standard mode (real-time and delayed-mode, QC 1 and 2, adjusted
    values merged) ensures that only QC flags 1 and 2 are retained; all other flags
    are excluded. Expert mode (raw unadjusted data, all QC flags 0–9 included without
    filtering) performs no qc filtering applied; all qc flags (0-9) retained as measured.'
  source_code_path: src/siqva/qc.py, src/siqva/spec.py
  origin: code
- id: siqva-delayed-mode-timing
  question_examples:
  - Why is recent Argo data missing in research mode?
  - How long does delayed-mode quality control take for Argo floats?
  - Why are recent profiles only in real-time or adjusted mode?
  answer: Recent Argo observations may appear missing when querying in research mode
    because rigorous delayed-mode quality control takes about 12 months after profile
    collection. During this 12-month period, national data centres accumulate regional
    time series to perform expert scientific calibration and detect subtle salinity
    sensor drift against reference climatologies. Recent profiles collected within
    the past year are available only in real-time or adjusted mode. Users seeking
    observations from the past 12 months should switch their query mode to standard
    mode.
  source_code_path: src/siqva/fetcher.py, src/siqva/qc.py
