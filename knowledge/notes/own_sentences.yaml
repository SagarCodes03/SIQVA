- id: siqva-delayed-mode-timing
  question_examples:
  - Why is recent Argo data missing in research mode?
  - How long does delayed-mode quality control take for Argo floats?
  - Why are recent profiles only in real-time or adjusted mode?
  answer: Research mode queries return empty for recent time windows because delayed-mode
    quality control takes about 12 months after collection. Recent profiles collected
    within 365 days of the query date are available in real-time or adjusted mode
    and are not included in research mode. Users seeking observations from the past
    12 months can switch to standard mode or choose an earlier date range where delayed-mode
    data is published. Scientific background on delayed-mode calibration procedures
    is documented in the source-derived note delayed-mode-timing.
