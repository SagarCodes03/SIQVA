- id: siqva-llm-data-privacy
  question_examples:
  - Does the language model see my ocean data in SIQVA?
  - What information is sent to the LLM in SIQVA?
  - Are oceanographic numbers and statistics generated by an LLM in SIQVA?
  - How does data privacy work across different LLM backends in SIQVA?
  answer: 'SIQVA configures three language model backend options: openai_compatible,
    ollama, and none. The hosted openai_compatible backend sends only the user question
    text (capped at 500 characters) and fixed schema instructions to the remote provider.
    The ollama backend sends that same question text and fixed instructions to a local
    server, while the none backend sends nothing and uses deterministic rules only.
    Oceanographic data values, profile observations, calculation results, and summary
    statistics are never included in prompts or sent to any language model.'
