- id: siqva-plan-decisions-refusal
  question_examples:
  - How does SIQVA decide whether to fetch full data, chunk, sample, or refuse?
  - Why was my query refused as oversized?
  - What are the thresholds for single-request and chunked queries?
  answer: 'The query planner evaluates requests using exact profile counts from the
    local float index when covered, falling back to a geometric cost cap of 15,000
    units only when the index is unavailable. Requests execute as a full fetch if
    under 60,000 estimated rows, or as monthly chunks if fitting up to 24 months and
    3,000,000 total rows. When a request exceeds full or chunked capacity, modules
    with sample_ok data needs execute as a profile sample, whereas full_required modules
    refuse execution. Refused queries receive structured alternative options: a narrower
    period, a shallower layer, a smaller sub-region, a float position map, or a profile
    sample.'
