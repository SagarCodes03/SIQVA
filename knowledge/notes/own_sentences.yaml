- id: siqva-sample-explanation
  question_examples:
  - What is a sample in SIQVA and why did I get one?
  - Why did my query return a sample instead of all profiles?
  - How are sample profiles selected in SIQVA?
  answer: A sample in SIQVA is a space-time stratified selection of float profiles
    chosen when a complete regional dataset exceeds safe data-size caps. The system
    defaults to 12 profiles (with selectable steps of 12, 24, and 50) spread evenly
    across latitude, longitude, and observation time. Samples allow responsive visual
    exploration of profile shapes and water-column structure without overwhelming
    ERDDAP servers or browser memory. To ensure scientific integrity, regional aggregate
    statistics and physical oceanography calculations are strictly suppressed on sampled
    results.
  source_code_path: src/siqva/floatindex.py, src/siqva/analyzer.py, src/siqva/planner.py
