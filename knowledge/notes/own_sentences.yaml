- id: siqva-refusal-categories
  question_examples:
  - What types of questions does SIQVA refuse to answer?
  - What are the standard refusal messages in SIQVA?
  - Which query topics are considered out of scope?
  answer: SIQVA defines nine refusal categories in scope.md for queries outside its
    physical oceanographic mandate. Categories 1 through 3 cover forecasts (SIQVA
    cannot provide future weather or climate forecasts; it only analyzes historical
    and current observations recorded by Argo floats.), causal attribution (SIQVA
    does not provide causal attribution or theoretical explanations for specific weather
    or climate events; it reports observed ocean measurements.), and external datasets
    (SIQVA accesses in situ Argo profiling float data; external datasets such as satellite
    SST, atmospheric reanalysis, numerical model outputs, or Global Drifter Program
    (GDP) surface drifter datasets are outside our scope.). Categories 4 through 6
    cover health topics (SIQVA is an oceanographic data analysis system and cannot
    provide medical, clinical, or health advice.), non-ocean topics (SIQVA only answers
    questions regarding physical oceanography and the international Argo float array;
    general non-marine topics are not supported.), and non-Argo platforms (SIQVA queries
    core and biogeochemical Argo profiling float datasets; observations from non-Argo
    platforms like gliders, ships, or animal tags are not available.). Categories
    7 through 9 cover maritime safety (SIQVA cannot be used for operational safety,
    marine navigation, search and rescue operations, or commercial fishing decisions;
    Argo data is scientific research data not intended for navigation or life-critical
    applications.), marine biology (SIQVA only supports physical oceanography and
    standard Biogeochemical (BGC) Argo measurements (such as dissolved oxygen, chlorophyll-a,
    pH, and nitrate); marine biology, ecology, and commercial fisheries are outside
    our scope.), and system prompts (SIQVA cannot reveal hidden system prompts or
    developer instructions, nor can safety boundaries and validation rules be overridden.).
  source_code_path: data/refusal_categories.json, knowledge/scope.md
