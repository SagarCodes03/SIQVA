  answer: Every completed query generates a persistent QueryCard in SQLite recording
    the query spec, bounding box or basin, depth range, delivery mode, software versions,
    fetch timestamp, row count, profile count, and data hash. For sample queries,
    the card also records the selected profile list, plan decision, random seed, and
