- id: siqva-sample-explanation
  question_examples:
  - What is a sample in SIQVA and why did I get one?
  - Why did my query return a sample instead of all profiles?
  - How are sample profiles selected in SIQVA?
  - What calculations are omitted on sampled float data?
  answer: A sample in SIQVA is a space-time stratified selection of float profiles
    chosen when a request exceeds full dataset capacity, selecting from steps of 12,
    24, or 48 profiles up to a maximum of 50 (default 12). Regional aggregate statistics
    and region-level summaries are suppressed on sample selections to avoid unrepresentative
    sampling bias. Individual per-profile curves remain visible in plots, and per-profile
    physics values are retained for modules declared with per_profile_only in the
    capability profile. To obtain all profiles without sampling, users can query a
    narrower region, a shorter period, or a shallower layer.
