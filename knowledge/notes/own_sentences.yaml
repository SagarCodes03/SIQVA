- id: siqva-known-limits
  question_examples:
  - What are the known limitations of SIQVA?
  - Can SIQVA query regions that cross the 180 degree meridian?
  - Are statistics in SIQVA area-weighted across the ocean?
  - What are the sampling and time lag limitations?
  answer: Bounding boxes crossing the 180-degree antimeridian (where lon_min exceeds
    lon_max) are supported for local float index metadata overviews and profile samples,
    but are rejected for full and chunked remote observation fetches. Regional statistics
    are computed as arithmetic means across observations or depth bins rather than
    area-weighted oceanographic integrals, with profile depths capped at 2000 dbar.
    Research mode does not return observations from the past 12 months because delayed-mode
    quality control takes about 12 months after collection. Sample queries select
    a maximum of 50 profiles across space and time, and regional summary statistics
    are suppressed on sampled results.
