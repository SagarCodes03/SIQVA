- id: siqva-qc-data-modes
  question_examples:
  - What quality control data modes does SIQVA offer?
  - What is the difference between research, standard, and expert mode in SIQVA?
  - Which QC flags are excluded in research and standard mode?
  answer: 'SIQVA provides three quality control data delivery modes: research, standard,
    and expert. Research mode delivers delayed-mode only, QC=1 only, adjusted values
    merged, where strict qc=1 only (good data); all other flags and real-time records
    excluded. Standard mode delivers real-time and delayed-mode, QC 1 and 2, adjusted
    values merged, where only QC flags 1 and 2 are retained; all other flags are excluded.
    Expert mode delivers raw unadjusted data, all QC flags 0–9 included without filtering,
    where no qc filtering applied; all qc flags (0-9) retained as measured.'
