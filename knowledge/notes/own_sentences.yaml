- id: siqva-understood-as-depth
  question_examples:
  - What does 'Understood as' mean in SIQVA?
  - Why is a default depth of 0 to 500 dbar applied?
  - What do the tags like [rules] and [default] mean in the query interpretation?
  answer: The 'Understood as' header displays the exact structured query parameters
    interpreted from natural language, tagging each resolved parameter with provenance
    labels such as [rules], [llm], or [default]. When a user does not specify a vertical
    range, SIQVA automatically applies a default depth layer of 0 to 500 dbar. This
    default focuses data fetching on the upper ocean where ocean-atmosphere interaction
    occurs and sensor coverage is densest. Users can override this default at any
    time by specifying custom depths up to the 2000 dbar core Argo limit.
